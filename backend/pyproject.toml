[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ue-logger-backend"
version = "1.0.0"
description = "Reusable, Qt-free Unreal Engine log parsing and ingestion library"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
